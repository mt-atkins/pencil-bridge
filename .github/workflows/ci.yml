name: Build and checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check generated project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- PencilBridge.xcodeproj Mac/Info.plist iPad/Info.plist
      - name: Input and encrypted transport checks
        run: zsh scripts/check.sh
      - name: Build Mac app
        run: >-
          xcodebuild -project PencilBridge.xcodeproj -scheme PencilBridgeMac
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build iPad app
        run: >-
          xcodebuild -project PencilBridge.xcodeproj -scheme PencilBridgeiPad
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
